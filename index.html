<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b0f" />
    <meta name="description" content="灰烬地穴：一款俯视角单机 PvE 暗黑探索网页游戏。" />
    <title>灰烬地穴 · 探索与撤离</title>
  </head>
  <body>
    <main
      id="game-shell"
      role="application"
      tabindex="0"
      aria-label="灰烬地穴游戏"
      aria-describedby="game-help"
    >
      <div id="game"></div>
      <p id="game-help" class="visually-hidden">
        前厅按数字 1 到 3 切换探索、仓库和交易行，按 Enter 进入探索，Escape 返回探索页。
        使用 W A S D 移动，空格或鼠标左键攻击，Shift 翻滚，按住 E 搜索，数字 1 和 2 切换武器，3 和 4 选择医疗物资，Q 使用所选医疗物资，R 换弹，V 使用应急短刃，Tab 打开负载，Escape 打开暂停菜单，M 静音。
        宝箱界面点击或按数字 1 到 5 搜索未知物品，再次操作即可拾取；按 E、Tab 或 Escape 关闭。
        撤离界面按 1 完整撤离，按 2 丢包撤离。
      </p>
      <div id="game-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
